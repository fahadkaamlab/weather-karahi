<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karachi Weather</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Karachi Weather</h1>
        <p>Live conditions and 7-day forecast for Karachi, Pakistan.</p>
      </header>

      <section class="current" aria-live="polite">
        <h2>Current Weather</h2>
        <div id="current-weather" class="card loading">Loading current weather...</div>
      </section>

      <section class="forecast" aria-live="polite">
        <h2>7-Day Forecast</h2>
        <div id="forecast" class="forecast-grid"></div>
      </section>

      <p id="updated-at" class="updated-at"></p>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
